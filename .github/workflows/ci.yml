name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # `pnpm typecheck` 直接跑 tsc（一次覆盖全部包的源码树），不经过 turbo，
      # 所以 `.turbo` 缓存永远 miss；tool-cache 换来的则是 tsc 增量信息。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Run typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 同 typecheck：ESLint 从仓库根一次跑完，不经过 turbo。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Run lint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # vitest 同样不由 turbo 驱动，也没有值得留到下轮的产物。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      # 只跑一次：`test:coverage` 本身就是「跑全部测试 + 收集覆盖率」。
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  # 这个 job 回答的是「这次的改动还能不能构建」。
  #
  # 它只有每次 push 都跑才有意义：产物路径、入口文件名、构建期常量这类错误，
  # typecheck / lint / test 一路全绿也照样漏过去，只有真的跑一次 `pnpm build` 才看得见。
  #
  # `needs: [typecheck, test]` 只是省算力：前两个红了就没必要再打一遍。
  build:
    name: Build
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 这是 CI 里唯一会写 `.turbo` 的 job（`turbo run build`），所以缓存开关保持默认开启。
      - name: Set up environment
        uses: ./.github/actions/setup

      # `pnpm build` 就是 `turbo run build`：按包依赖顺序构建。
      # 当前骨架里还没有包定义 `build`，这条命令是空跑，等第一个真实包落地后自动生效。
      - name: Build
        run: pnpm build

  # 这个 job 回答的是「Windows 上还能不能跑」。
  #
  # 它是**唯一**能拿到 Windows 证据的地方：开发机是 Linux，没有第二台能跑 win32 的机器。
  # 前面那些 ubuntu job 全绿也证明不了这件事——它们跑的是 Linux 的 `path.sep`、
  # `homedir()`、`/home/...` 前缀，而 Windows 上这三样全都是另一副样子。
  #
  # 只跑 lint / typecheck / test / build 四样，**不跑 e2e**：那几个脚本是 bash + docker，
  # 而 Windows runner 上既没有那套 shell 语义，也不是「在 Windows 上跑产品」要证明的事。
  # 放在一个 job 里而不是拆成四个，是因为 `pnpm install` 在 Windows runner 上是这几个里
  # 最慢的一步，拆开等于把它跑四遍。
  windows:
    name: Windows
    runs-on: windows-latest
    # 与打包流水线同因：默认 6 小时的上限会让一条卡住的下载占满整个下午。
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          tool-cache: 'true'

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # 这个 job 回答的是「这些零件接起来还能不能跑」。
  #
  # 上面三个 job 全绿也证明不了这件事：单测里每一层都用自己的替身，所以**契约一漂移
  # 就整片漏过去**。已经真出过一次：一个 lane 给 `stageAgentConfig` 加了必填参数，
  # 另一个 lane 的驱动还按旧契约调用 —— typecheck 过了（那是个纯 JS 脚本）、
  # 单测过了（测试传的是自己造的路径）、build 过了，真跑起来直接崩在
  # `mkdirSync(undefined)`，容器一个都没起。
  #
  # 只跑两个**不需要任何凭据**的：
  #   - `e2e-local`  容器是假的，但配置解析 / broker / 凭据注入 / 出口白名单 /
  #                  审计落盘 / 会话编排 / 拆除旁路检查全是真的，不需要 docker；
  #   - `e2e-docker` 容器、网络、地址解析是真的，只验「舱内能不能连上舱面」。
  # `e2e-agent-claude` **不进 CI**：它要从宿主 `~/.claude/settings.json` 读真网关地址
  # 与真密钥，CI 上既不该有也不该配。它留在开发机上手动跑。
  e2e:
    name: End to end
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 这两个脚本直接跑 TS 源码（各自用 `node --import` 挂一个 resolve 钩子），
      # 不读任何构建产物，所以不经过 turbo，也不该开 turbo-cache。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      - name: Run the local end-to-end script
        run: bash packages/toolkit/scripts/e2e-local.sh

      # 脚本在 docker 不可用时也返回 0 并写明原因，所以 runner 环境差异不会造成假红；
      # 但「舱内连不上舱面」这种真问题会真红。
      - name: Run the docker end-to-end script
        run: bash packages/toolkit/scripts/e2e-docker.sh
