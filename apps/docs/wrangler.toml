# abx 使用手册站点。部署由 **Cloudflare 侧的 Workers Git 集成**完成
# （Dashboard → Workers & Pages → 本项目 → Settings → Build）：
#
#   Root directory     `apps/docs`
#   Build command      `pnpm install && pnpm build`
#   Deploy command     `npx wrangler deploy`
#
# ⚠️ 本项目在 Cloudflare 侧是一个 **Worker**（Workers Builds），**不是**经典 Pages
# 项目。所以这里用 **Workers Static Assets** 的配置形状（与 osw 的 `apps/docs` 一致），
# 部署命令是 Workers 的 `npx wrangler deploy`。
#
# 反过来，若照 Pages 那样写 `pages_build_output_dir`，`npx wrangler deploy` 会因为
# 看不出「产物目录」而报 `✘ Missing entry-point to Worker script or to assets directory`
# ——**构建是成功的，只有部署这一步失败**，很容易误判成缓存或没保存。
# **判断形状看部署命令**：用 `npx wrangler deploy` 就是 Workers 形状（配 `[assets]`），
# 用 `npx wrangler pages deploy` 才是 Pages 形状（配 `pages_build_output_dir`）。
#
# **纯静态**：Clarify 的产物是逐页静态 HTML（`output/<slug>/index.html`）加搜索索引、
# 每页的 `.md` 孪生文件与 `llms.txt`；没有 Worker 脚本，只有 `[assets]`，所以既不
# 需要 `main`，也不需要任何绑定或密钥。目录名与 `source/` 对仗：`source` 进、`output` 出。

name = "abx-docs"

# 固定兼容日期，不跟最新。站点是纯静态资源，没有运行时逻辑，但显式写死可以避免
# 「后台某天改成了 Latest」这种仓库外漂移。
compatibility_date = "2026-10-01"

# 这两个默认值显式写出来，理由与 `apps/www/wrangler.toml` 相同：不写的话每次部署都会
# 告警，而告警描述的默认行为已经在生效——「配置里没写」和「线上没开」于是成了两件事。
#
# workers.dev 域名现在就是文档的线上地址：https://abx-docs.yinxulai.workers.dev
# 等自定义域名定下来，在顶层加 `routes`，那时再把这里改成 false。
workers_dev = true
preview_urls = true

# ---------------------------------------------------------------- 域名
#
# 自定义域名尚未定。定下来以后在这里加顶层 `routes`：
#
#   routes = [{ pattern = "docs.abx.example.com", custom_domain = true }]
#
# 注意它必须写在**任何 `[表头]` 之前**：TOML 里 `[assets]` 之后的键都会落入那张表，
# 放错位置只会得到「Unexpected fields found in …」的告警，而部署照常进行。

# ---------------------------------------------------------------- 预览构建
#
# 空块，但**必须有**。非生产分支的 push 走的是 Cloudflare 的 Worker Previews
# （Preview 命令默认 `npx wrangler preview`），而那条命令要求配置里存在 `previews`
# 块——**即使里面什么都没有**。缺了它不是「预览稍微差一点」，而是直接失败：
#
#   ✘ Your Wrangler configuration is missing a `previews` block to run this command.
#
# 症状具有欺骗性：那条 check 只出现在 PR 上，生产分支永远是绿的（生产跑 deploy，
# 不跑 preview），于是很容易当成「这个分支的内容坏了」——其实任何 PR 都会红。
#
# 为什么是空的：Previews 不继承生产设置，凡是预览独占的东西（变量、绑定、密钥）
# 都该写在这里；本站是纯静态资源，一件都没有。`assets`、`compatibility_date` 留在
# 顶层——文档明确说它们不进 `previews`，进来反而不生效。
[previews]

# 静态资源：Clarify 构建产物。站点是**多页站**（不是 SPA），未知路径应按 404 处理，
# 所以用 `not_found_handling = "404-page"`（而非 `single-page-application`）。
[assets]
directory = "./output"
not_found_handling = "404-page"
