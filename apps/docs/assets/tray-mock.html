<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>abx tray — mock</title>
<style>
  /* ============ 设计令牌，逐字取自 packages/console/source/styles.css ============
     面板的令牌只有一份来源（真面板），这里不重新挑颜色：两张图都必须能被
     「照真面板核对」这一条判据检查。 */
  .light {
    --bg: #fafafa;
    --surface: #ffffff;
    --raised: #f1f1f2;
    --border: #e2e2e5;
    --border-strong: #82848a;
    --text: #1a1b1d;
    --text-muted: #5c5e65;
    --accent: #0e8c80;
  }
  .dark {
    --bg: #191a1c;
    --surface: #232427;
    --raised: #2b2c2f;
    --border: #35373b;
    --border-strong: #7e8288;
    --text: #f2f3f4;
    --text-muted: #9b9da3;
    --accent: #3fd9c6;
  }

  /* 窗口几何：422 宽、28 的透明留白、卡片 366（console 的 --panel-* 三个变量）。 */
  :root {
    --font-sans: -apple-system, 'SF Pro Text', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
    --radius-md: 6px;
    --radius-lg: 10px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: #1a1a1c;
    padding: 40px;
    display: flex;
    gap: 48px;
    align-items: flex-start;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- shell：托盘窗口本身（422 宽，四周 28 的透明留白） ---- */
  .window {
    width: 422px;
    padding: 28px;
    border-radius: 18px;
    background: #2a2a2e;         /* 站在桌面上 */
  }
  .window.light { background: #d9d9dd; }

  .panel {
    width: 366px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 8px 24px rgb(0 0 0 / 0.12), 0 1px 4px rgb(0 0 0 / 0.06);
    overflow: hidden;
  }

  /* ================= header =================
     副标题是面板上唯一一句状态，**只说后果，不说术语**——
     逐字来自 `packages/console` 的 `PanelCard`（在跑那一档）。
     header 上没有计数：数量归管理面板（`design-system.md` §8）。 */
  header {
    display: flex; align-items: center; gap: 8px;
    min-height: 56px; padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .appicon {
    display: grid; place-items: center;
    width: 28px; height: 28px; flex: none;
    border-radius: var(--radius-md);
    background: var(--text); color: var(--surface);
    font-size: 13px; font-weight: 600; line-height: 1;
  }
  .titles { display: flex; min-width: 0; flex: 1; flex-direction: column; }
  .titles strong { font-size: 13px; font-weight: 600; line-height: 18px; }
  .sub { color: var(--text-muted); font-size: 12px; font-weight: 400; line-height: 16px; }

  /* ================= agent 一排 =================
     只有图标，没有名字：名字在悬停与键盘聚焦时出现（`tray-ui.md` §3）。
     只画已安装的 agent —— dsh 的镜像还没构建，不进这一排（§3.1 ④）。 */
  .agents {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 12px 16px;
  }
  .agent {
    position: relative;
    display: grid; place-items: center;
    width: 44px; height: 44px;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    /* 底色是中性底掺一点品牌色（`--abx-agent-color`）。Claude Code 的品牌色是
       `#d97757`，Codex 没写颜色，于是底就是中性的 `--raised`。 */
    background: var(--raised);
  }
  .agent.claude { background: color-mix(in srgb, #d97757 16%, var(--raised)); }
  .mark { color: var(--text); font-size: 13px; font-weight: 600; line-height: 1; }
  /* 状态先靠形状：在跑的 = 2px 实线描边，没跑的 = 中性虚线描边。 */
  .agent.running { border: 2px solid var(--text); }
  .agent.idle { border: 1px dashed var(--border-strong); }
  /* 右下角的点：实心 = 在跑，空心圈 = 没跑。两档的差别落在填充上，色相只是补充。 */
  .dot {
    position: absolute; right: 4px; bottom: 4px;
    width: 8px; height: 8px;
    border: 1.5px solid var(--text);
    border-radius: var(--radius-pill);
    background: transparent;
  }
  .agent.running .dot { border: 0; background: var(--accent); }

  /* ================= 共享区 ================= */
  .section { padding: 0 16px 12px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 6px;
  }
  .section-head h2 { color: var(--text-muted); font-size: 12px; font-weight: 500; line-height: 16px; }
  .count { color: var(--text-muted); font-size: 11px; font-weight: 400; line-height: 14px; }
  .list {
    margin-bottom: 8px; padding: 0; list-style: none;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    overflow: hidden;
  }
  li {
    display: flex; align-items: center; gap: 8px;
    min-height: 40px; padding: 8px 12px;
    border-top: 1px solid var(--border);
  }
  li:first-child { border-top: 0; }
  .glyph { flex: none; color: var(--text-muted); font-size: 12px; }
  .name {
    overflow: hidden; flex: 1;
    font-size: 13px; line-height: 18px;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .badge {
    flex: none; padding: 2px 6px;
    border-radius: var(--radius-pill);
    background: var(--raised); color: var(--text-muted);
    font-size: 11px; font-weight: 500; line-height: 14px;
  }

  /* ---- 拖放区：只有这一句，空态与非空态都是它（`tray-ui.md` §7 第 3 条） ---- */
  .drop {
    padding: 8px 12px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-md);
    color: var(--text-muted);
    font-size: 12px; line-height: 16px;
    text-align: center;
  }

  /* 面板上**没有第四块**：footer（审计流水 / 停止全部 / 退出）已经删掉，
     「停止全部」在管理面板顶部（`functional-design.md` §13）。 */

  .caption {
    margin-bottom: 12px;
    color: #9a9aa2; font-size: 11px; font-weight: 500; letter-spacing: .02em;
  }
</style>
</head>
<body>

  <!-- ======================= DARK ======================= -->
  <div>
    <div class="caption">DARK · macOS 深色</div>
    <div class="window">
      <div class="panel dark">

        <header>
          <span class="appicon">a</span>
          <span class="titles">
            <strong>abx</strong>
            <span class="sub">运行中 · 它拿不到你的密钥</span>
          </span>
        </header>

        <div class="agents">
          <span class="agent claude running">
            <span class="mark">C</span>
            <span class="dot"></span>
          </span>
          <span class="agent idle">
            <span class="mark">O</span>
            <span class="dot"></span>
          </span>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>共享给全部 agent</h2>
            <span class="count">3 项</span>
          </div>

          <ul class="list">
            <li>
              <span class="glyph">▤</span>
              <span class="name">design-spec.pdf</span>
              <span class="badge">只读</span>
            </li>
            <li>
              <span class="glyph">▤</span>
              <span class="name">api-contract.md</span>
              <span class="badge">只读</span>
            </li>
            <li>
              <span class="glyph">◰</span>
              <span class="name">assets/</span>
              <span class="badge">只读</span>
            </li>
          </ul>

          <div class="drop">拖到这里 → 全部 agent 立刻可见</div>
        </div>

      </div>
    </div>
  </div>

  <!-- ======================= LIGHT ======================= -->
  <div>
    <div class="caption">LIGHT · macOS 浅色</div>
    <div class="window light">
      <div class="panel light">

        <header>
          <span class="appicon">a</span>
          <span class="titles">
            <strong>abx</strong>
            <span class="sub">运行中 · 它拿不到你的密钥</span>
          </span>
        </header>

        <div class="agents">
          <span class="agent claude running">
            <span class="mark">C</span>
            <span class="dot"></span>
          </span>
          <span class="agent idle">
            <span class="mark">O</span>
            <span class="dot"></span>
          </span>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>共享给全部 agent</h2>
            <span class="count">3 项</span>
          </div>

          <ul class="list">
            <li>
              <span class="glyph">▤</span>
              <span class="name">design-spec.pdf</span>
              <span class="badge">只读</span>
            </li>
            <li>
              <span class="glyph">▤</span>
              <span class="name">api-contract.md</span>
              <span class="badge">只读</span>
            </li>
            <li>
              <span class="glyph">◰</span>
              <span class="name">assets/</span>
              <span class="badge">只读</span>
            </li>
          </ul>

          <div class="drop">拖到这里 → 全部 agent 立刻可见</div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
